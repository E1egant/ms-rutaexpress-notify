spring:
  application:
    name: ms-rutaexpress-notify
  datasource:
    url: jdbc:h2:mem:notify;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rutaexpress}
    password: ${RABBITMQ_PASS:rutaexpress}

server:
  port: 8083
