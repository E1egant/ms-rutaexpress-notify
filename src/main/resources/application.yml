spring:
  application:
    name: ms-rutaexpress-notify
  datasource:
    url: jdbc:h2:mem:notify;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rutaexpress}
    password: ${RABBITMQ_PASS:rutaexpress}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

rutaexpress:
  rabbit:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead: cmd.dead.dlx
    queues:
      email: q.cmd.email
      warehouse: q.cmd.warehouse
      label: q.cmd.label
      dlq-suffix: .dlq
    routing:
      email-send: email.send
      warehouse-ticket: warehouse.ticket
      label-gen: label.gen
      email-pattern: "email.*"
      warehouse-pattern: "warehouse.#"
      label-pattern: "label.*"
      email-dead: "email.#"
      warehouse-dead: "warehouse.#"
      label-dead: "label.#"
    retry:
      max-attempts: 3

server:
  port: 8083

---
spring:
  config:
    activate:
      on-profile: secure
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          audiences: ${AZURE_API_AUDIENCE}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notify}
    username: ${DB_USER:rutaexpress}
    password: ${DB_PASS:rutaexpress}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
